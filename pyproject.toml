[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashquery"
version = "0.1.0"
description = "AI-powered PostgreSQL query optimizer - flash fast, query smart"
authors = [
    {name = "Samuel Iyiola"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "psycopg[binary]>=3.1.19",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "docker>=7.0.0",
    "pandas>=2.2.2",
    "tabulate>=0.9.0",
    "sqlparse>=0.5.1",
    "colorlog>=6.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
llm = [
    "litellm>=1.49.0",
]
github = [
    "PyGithub>=2.4.0",
]

[project.scripts]
flashquery = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true